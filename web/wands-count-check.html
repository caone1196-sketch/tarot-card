<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiểm tra số gậy — 2 lá làm lại</title>
<style>
  :root { --bg:#0e0c0a; --panel:#1e1a14; --gold:#d4af37; --ink:#e6d7b8; --ink-dim:#a8987e; --line:#3a3124; --warn:#d4a24a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:radial-gradient(1000px 500px at 50% -80px, rgba(212,175,55,.07), transparent 60%), var(--bg); color:var(--ink); font-family:Georgia,serif; min-height:100vh; padding:32px 20px 80px; }
  h1 { letter-spacing:3px; text-align:center; color:var(--gold); font-size:clamp(1.3rem,3vw,1.9rem); margin-bottom:6px; }
  p.sub { text-align:center; color:var(--ink-dim); margin-bottom:26px; font-style:italic; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:22px; max-width:900px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .card img { width:100%; display:block; }
  .label { padding:12px 14px; text-align:center; border-top:1px solid var(--line); }
  .label .t { color:var(--gold); letter-spacing:1px; font-size:1rem; }
  .label .c { display:block; margin-top:4px; font-size:.95rem; color:var(--warn); font-weight:bold; }
</style>
</head>
<body>
<h1>🔍 Kiểm tra 2 lá làm lại</h1>
<p class="sub">Đếm trực quan: Eight cần ĐÚNG 8 gậy · Knight cần ĐÚNG 1 gậy</p>
<div class="grid">
  <div class="card"><img src="../cards/wands-08.png" alt="Eight of Wands"><div class="label"><span class="t">EIGHT OF WANDS</span><span class="c">Cần ĐÚNG 8 gậy</span></div></div>
  <div class="card"><img src="../cards/wands-knight.png" alt="Knight of Wands"><div class="label"><span class="t">KNIGHT OF WANDS</span><span class="c">Cần ĐÚNG 1 gậy</span></div></div>
</div>
</body>
</html>
