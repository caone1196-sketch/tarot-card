<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensual Gothic Tarot — 78 Lá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0c0a;
    --bg-soft: #16120e;
    --panel: #1e1a14;
    --panel-2: #241f17;
    --gold: #d4af37;
    --gold-soft: #c9a24a;
    --gold-dim: #8a7340;
    --ink: #e6d7b8;
    --ink-dim: #a8987e;
    --ink-faint: #6f6350;
    --line: #3a3124;
    --accent: #9c5b2f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -100px, rgba(212,175,55,0.07), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(10px);
    background: rgba(14,12,10,0.82);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 1500px; margin: 0 auto;
    padding: 18px 28px 14px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .brand {
    display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700; letter-spacing: 3px;
    font-size: clamp(1.3rem, 3vw, 2rem);
    color: var(--gold);
    text-shadow: 0 0 24px rgba(212,175,55,0.25);
  }
  .count-pill {
    font-family: 'Cinzel', serif; font-size: 0.78rem; letter-spacing: 1px;
    color: var(--ink-dim);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 14px; background: var(--bg-soft);
  }
  .controls {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .search {
    flex: 1 1 260px; display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px;
  }
  .search input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--ink); font-family: inherit; font-size: 1.02rem;
  }
  .search input::placeholder { color: var(--ink-faint); }
  .search svg { width: 18px; height: 18px; stroke: var(--gold-dim); flex: none; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    font-family: 'Cinzel', serif; font-size: 0.74rem; letter-spacing: 1.2px;
    color: var(--ink-dim); background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 16px; cursor: pointer; user-select: none;
    transition: all 0.2s ease; text-transform: uppercase;
  }
  .tab:hover { color: var(--gold-soft); border-color: var(--gold-dim); }
  .tab.active {
    color: #14100a; background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    border-color: var(--gold); font-weight: 700;
  }
  .tab .n { opacity: 0.7; font-size: 0.66rem; margin-left: 4px; }

  .draw-btn {
    font-family: 'Cinzel', serif; font-size: 0.78rem; letter-spacing: 1.2px;
    color: #14100a; font-weight: 700; text-transform: uppercase;
    background: linear-gradient(180deg, #e2c46a, #c9a24a);
    border: 1px solid var(--gold); border-radius: 10px;
    padding: 10px 18px; cursor: pointer; white-space: nowrap;
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  }
  .draw-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(212,175,55,0.35);
    filter: brightness(1.06);
  }
  .draw-btn:active { transform: translateY(0); }
  .back-btn {
    background: linear-gradient(180deg, #241f17, #1a1510);
    color: var(--gold-soft);
  }
  .back-btn:hover { filter: brightness(1.25); }

  /* ---------- grid ---------- */
  main { max-width: 1500px; margin: 0 auto; padding: 30px 28px 80px; }
  .group-label {
    font-family: 'Cinzel', serif; letter-spacing: 2px; font-size: 0.92rem;
    color: var(--gold-soft); margin: 34px 4px 14px;
    display: flex; align-items: center; gap: 14px;
  }
  .group-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 22px;
  }
  .card {
    cursor: pointer; position: relative;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden;
    transition: transform 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease;
  }
  .card:hover {
    transform: translateY(-6px);
    border-color: var(--gold);
    box-shadow: 0 16px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(212,175,55,0.25);
  }
  .card .frame {
    position: relative; aspect-ratio: 7 / 12; overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #241f17, #14100b);
  }
  .card img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transform: scale(1.001); transition: transform 0.4s ease;
  }
  .card:hover img { transform: scale(1.045); }
  .card .shade {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 62%, rgba(10,8,6,0.92));
    pointer-events: none;
  }
  .card .meta {
    position: absolute; left: 14px; right: 14px; bottom: 12px;
  }
  .card .title {
    font-family: 'Cinzel', serif; font-size: 0.92rem; letter-spacing: 1px;
    color: var(--gold); font-weight: 600; line-height: 1.25;
  }
  .card .sub {
    font-size: 0.84rem; color: var(--ink-dim); margin-top: 3px;
    font-style: italic;
  }

  .empty {
    text-align: center; padding: 70px 20px; color: var(--ink-faint);
    font-size: 1.1rem; font-style: italic;
  }

  /* ---------- lightbox ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(6,5,4,0.9); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center;
    padding: 30px;
  }
  .lightbox.open { display: flex; }
  .lb-card {
    display: grid; grid-template-columns: minmax(260px, 420px) minmax(280px, 460px);
    gap: 0; background: var(--panel-2);
    border: 1px solid var(--gold-dim); border-radius: 14px; overflow: hidden;
    max-width: 900px; width: 100%; max-height: 92vh;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    animation: pop 0.22s ease;
  }
  @keyframes pop { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .lb-img { position: relative; background: #0a0806; }
  .lb-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .lb-info { padding: 26px 26px 30px; overflow-y: auto; }
  .lb-info h2 {
    font-family: 'Cinzel', serif; font-size: 1.5rem; letter-spacing: 2px;
    color: var(--gold); margin-bottom: 4px;
  }
  .lb-info .emblem { font-size: 1rem; font-style: italic; color: var(--gold-soft); margin-bottom: 18px; }
  .lb-field { margin-bottom: 12px; }
  .lb-field .k {
    font-family: 'Cinzel', serif; font-size: 0.68rem; letter-spacing: 1.6px;
    text-transform: uppercase; color: var(--gold-dim); margin-bottom: 3px;
  }
  .lb-field .v { font-size: 1.04rem; color: var(--ink); line-height: 1.5; }
  .lb-close {
    position: absolute; top: 14px; right: 14px;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(20,16,10,0.85); border: 1px solid var(--gold-dim);
    color: var(--gold); font-size: 1.4rem; line-height: 1;
    cursor: pointer; transition: all 0.2s ease; z-index: 2;
  }
  .lb-close:hover { background: var(--gold); color: #14100a; }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(20,16,10,0.8); border: 1px solid var(--gold-dim);
    color: var(--gold); font-size: 1.5rem; cursor: pointer;
    transition: all 0.2s ease; z-index: 2;
  }
  .lb-nav:hover { background: var(--gold); color: #14100a; }
  .lb-prev { left: 18px; } .lb-next { right: 18px; }

  footer {
    border-top: 1px solid var(--line); text-align: center;
    padding: 26px; color: var(--ink-faint); font-size: 0.9rem;
  }
  @media (max-width: 760px) {
    .lb-card { grid-template-columns: 1fr; max-height: 94vh; }
    .lb-img { max-height: 46vh; }
    .lb-nav { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <h1>🔮 SENSUAL GOTHIC TAROT</h1>
      <span class="count-pill" id="countPill">78 lá</span>
    </div>
    <div class="controls">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="Tìm lá bài, biểu tượng, độ tuổi, chủ đề…" autocomplete="off">
      </div>
      <button class="draw-btn" id="drawBtn" title="Rút ngẫu nhiên một lá bài">✦ Rút một lá</button>
      <button class="draw-btn back-btn" id="backBtn" title="Xem mặt sau lá bài">Mặt sau</button>
      <div class="tabs" id="tabs"></div>
    </div>
  </div>
</header>

<main id="main"></main>

<footer>Bộ bài 78 lá · Chuẩn cấu trúc The Star · 100% nhân vật nữ 18–25 · Nguồn: GitHub caone1196-sketch/tarot-card · <span id="footCount"></span></footer>

<!-- card back overlay -->
<div class="lightbox" id="backLightbox">
  <button class="lb-close" id="backClose" aria-label="Đóng">×</button>
  <div class="lb-card" style="grid-template-columns: 1fr; max-width: 430px;">
    <div class="lb-img"><img src="https://raw.githubusercontent.com/caone1196-sketch/tarot-card/arena/01a058af-tarot-card/cards/card-back.png" alt="Mặt sau lá bài" onerror="this.onerror=null;this.src='../cards/card-back.png'"></div>
  </div>
</div>

<!-- lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Đóng">×</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Trước">‹</button>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Sau">›</button>
  <div class="lb-card">
    <div class="lb-img"><img id="lbImg" alt=""></div>
    <div class="lb-info">
      <h2 id="lbTitle"></h2>
      <div class="emblem" id="lbEmblem"></div>
      <div class="lb-field"><div class="k">Độ tuổi</div><div class="v" id="lbAge"></div></div>
      <div class="lb-field"><div class="k">Mái tóc</div><div class="v" id="lbHair"></div></div>
      <div class="lb-field"><div class="k">Thân hình</div><div class="v" id="lbBuild"></div></div>
      <div class="lb-field"><div class="k">Cảnh / Chủ đề</div><div class="v" id="lbScene"></div></div>
    </div>
  </div>
</div>

<script>
const GROUPS = [
  { key: 'major', label: 'Ẩn Chính', match: s => /^\d{2}-/.test(s) },
  { key: 'wands', label: 'Gậy', match: s => s.startsWith('wands-') },
  { key: 'cups', label: 'Cốc', match: s => s.startsWith('cups-') },
  { key: 'swords', label: 'Kiếm', match: s => s.startsWith('swords-') },
  { key: 'pentacles', label: 'Tiền', match: s => s.startsWith('pentacles-') },
];
const RANK = ['ace','02','03','04','05','06','07','08','09','10','page','knight','queen','king'];

// Thư viện lá bài trên GitHub (nguồn chính), local là dự phòng.
const GITHUB_RAW = 'https://raw.githubusercontent.com/caone1196-sketch/tarot-card/arena/01a058af-tarot-card/cards';
function imgTag(image, alt, lazy) {
  const local = '../cards/' + image;
  const remote = GITHUB_RAW + '/' + image;
  const lz = lazy ? ' loading="lazy"' : '';
  return `<img src="${remote}" alt="${alt}"${lz} onerror="this.onerror=null;this.src='${local}'">`;
}

let DECK = [];
let filtered = [];
let currentGroup = 'all';
let currentQuery = '';
let lbIndex = -1;

function groupOf(slug) {
  for (const g of GROUPS) if (g.match(slug)) return g.key;
  return 'other';
}
function sortKey(slug) {
  const g = groupOf(slug);
  const gi = GROUPS.findIndex(x => x.key === g);
  let rank = 99;
  if (g === 'major') {
    const m = slug.match(/^(\d{2})-/);
    if (m) rank = parseInt(m[1], 10);
  } else {
    const r = RANK.indexOf(slug.split('-').pop());
    if (r >= 0) rank = r;
  }
  return [gi, rank, slug];
}

async function load() {
  let data = null;
  const urls = [GITHUB_RAW + '/deck.json', '../cards/deck.json'];
  for (const u of urls) {
    try {
      const res = await fetch(u);
      if (res.ok) { data = await res.json(); break; }
    } catch (e) { /* try next */ }
  }
  if (!data || !Array.isArray(data.cards)) {
    // graceful fallback: empty with message
    DECK = [];
    render();
    return;
  }
  DECK = data.cards.map(c => ({ ...c, group: groupOf(c.slug) }));
  DECK.sort((a, b) => sortKey(a.slug) - sortKey(b.slug));
  buildTabs();
  applyFilter();
  document.getElementById('footCount').textContent = DECK.length + ' lá';
}

function buildTabs() {
  const tabs = document.getElementById('tabs');
  const defs = [
    { key: 'all', label: 'Tất cả' },
    ...GROUPS.map(g => ({ key: g.key, label: g.label })),
  ];
  tabs.innerHTML = defs.map(d => {
    const n = d.key === 'all' ? DECK.length : DECK.filter(c => c.group === d.key).length;
    return `<button class="tab${d.key === 'all' ? ' active' : ''}" data-key="${d.key}">${d.label}<span class="n">${n}</span></button>`;
  }).join('');
  tabs.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    tabs.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentGroup = t.dataset.key;
    applyFilter();
  }));
}

function applyFilter() {
  filtered = DECK.filter(c => {
    if (currentGroup !== 'all' && c.group !== currentGroup) return false;
    if (currentQuery) {
      const q = currentQuery.toLowerCase();
      const hay = [c.title, c.emblem, c.age, c.hair, c.build, c.scene].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  render();
}

function render() {
  const main = document.getElementById('main');
  const pill = document.getElementById('countPill');
  pill.textContent = filtered.length + ' lá';

  if (!filtered.length) {
    main.innerHTML = `<div class="empty">Không tìm thấy lá bài nào khớp.</div>`;
    return;
  }

  // group rendering (only when showing 'all')
  if (currentGroup === 'all') {
    let html = '';
    for (const g of GROUPS) {
      const cards = filtered.filter(c => c.group === g.key);
      if (!cards.length) continue;
      html += `<h2 class="group-label">${g.label}</h2><div class="grid">` + cards.map(cardHtml).join('') + `</div>`;
    }
    main.innerHTML = html;
  } else {
    const g = GROUPS.find(x => x.key === currentGroup);
    main.innerHTML = `<h2 class="group-label">${g ? g.label : ''}</h2><div class="grid">` + filtered.map(cardHtml).join('') + `</div>`;
  }
  main.querySelectorAll('.card').forEach((el, i) => {
    const idx = filtered.indexOf(filtered[i]);
    el.addEventListener('click', () => openLightbox(idx));
  });
}

function cardHtml(c) {
  return `
    <div class="card" data-slug="${c.slug}">
      <div class="frame">
        ${imgTag(c.image, c.title, true)}
        <div class="shade"></div>
        <div class="meta">
          <div class="title">${c.title}</div>
          <div class="sub">${c.age || '—'}</div>
        </div>
      </div>
    </div>`;
}

function openLightbox(i) {
  lbIndex = i;
  showLightbox();
}
function showLightbox() {
  const c = filtered[lbIndex];
  if (!c) return;
  const lb = document.getElementById('lbImg');
  lb.onerror = () => { lb.onerror = null; lb.src = '../cards/' + c.image; };
  lb.src = GITHUB_RAW + '/' + c.image;
  document.getElementById('lbTitle').textContent = c.title;
  document.getElementById('lbEmblem').textContent = 'Huy hiệu: ' + (c.emblem || '—');
  document.getElementById('lbAge').textContent = c.age || '—';
  document.getElementById('lbHair').textContent = c.hair || '—';
  document.getElementById('lbBuild').textContent = c.build || '—';
  document.getElementById('lbScene').textContent = c.scene || '—';
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function navLightbox(d) {
  if (!filtered.length) return;
  lbIndex = (lbIndex + d + filtered.length) % filtered.length;
  showLightbox();
}

function drawRandom() {
  if (!DECK.length) return;
  // reset filters to see the whole deck
  currentGroup = 'all';
  currentQuery = '';
  document.getElementById('search').value = '';
  document.querySelectorAll('.tab').forEach(x =>
    x.classList.toggle('active', x.dataset.key === 'all'));
  applyFilter();
  lbIndex = Math.floor(Math.random() * filtered.length);
  showLightbox();
}

document.getElementById('search').addEventListener('input', e => {
  currentQuery = e.target.value.trim();
  applyFilter();
});
document.getElementById('drawBtn').addEventListener('click', drawRandom);

// card back overlay
const backLightbox = document.getElementById('backLightbox');
document.getElementById('backBtn').addEventListener('click', () => {
  backLightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
});
function closeBack() {
  backLightbox.classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('backClose').addEventListener('click', closeBack);
backLightbox.addEventListener('click', e => {
  if (e.target === e.currentTarget) closeBack();
});
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', () => navLightbox(-1));
document.getElementById('lbNext').addEventListener('click', () => navLightbox(1));
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeLightbox();
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);
});

load();
</script>
</body>
</html>
